[package]
name = "lvjiaoxi-viewer"
version = "0.1.0"
description = "绿角犀看图桌面版"
authors = ["LvJiaoXi"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "lvjiaoxi_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心；tray-icon 启用系统托盘，image-png 用于默认窗口图标
tauri = { version = "2", features = ["tray-icon", "image-png"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 位图解码：覆盖 jpg/png/gif/bmp/ico/tiff/tga/pnm/dds/webp/exr/jxl；WebView 原生支持 jpg/png/gif/webp/bmp/ico/svg/avif/apng，无需后端解码
image = { version = "0.25", features = ["jpeg", "png", "gif", "bmp", "ico", "tiff", "tga", "rayon", "webp", "exr"] }
# PSD/PSB 原生解码（展平缩略图），纯 Rust 无系统依赖，Android 也能编译
ag-psd = "0.3"
# EXIF 方向纠正（旋转/翻转烘焙）
kamadak-exif = "0.6"
# data URL 编码
base64 = "0.22"
# SVG 文本内联
percent-encoding = "2"
# 压缩包直看（ZIP/CBZ 不解压直接浏览）
zip = "2"
# 并行处理：load_paths 多线程读磁盘 + base64 编码，53 张图从 2 秒降到 300ms
rayon = "1"

# Android 不支持 arboard（剪贴板位图）和单实例 plugin，移到桌面专用
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"
tauri-plugin-single-instance = "2"

# ===== 扩展点（PRD 5.2 需后端解码的格式，按需解除注释并实现 decode_to_rgb 对应分支）=====
# libheif-rs = "1"     # HEIC / HEIF
# rawler = "1"         # RAW (CR2 / NEF / ARW / DNG ...)
# psd = "0.3"          # PSD
# rar = "0.9"          # RAR / CBR（后续版本再加）
# sevenz-rust = "0.3"  # 7Z（后续版本再加）
